# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms
name: Documentation Refinements
description: Fix any grammar mistakes or suggest new formatting!

title: "[Name of Document]"
labels: ["documentation"]
assignees: ["N1femi"]

body: 
  - type: dropdown
    attributes:
      label: Relevance
      description: What category is your request most closely associated with?
      options:
        - Grammar
        - Better Formatting
        - Technical Correction
    validations:
      required: true

  - type: textarea
    attributes:
      label: Extra Notes
      description: Anything you need to say?
      placeholder: Blah Blah Blah
    validations:
      required: false
        
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to contribute!
        > You can ignore everything below this and just Submit!

    
    


  
